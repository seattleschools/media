<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zanez Arcade</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #060b19;
      color: #ffffff;
      overflow: hidden;
    }

    .sidebar {
      width: 60px;
      background-color: #0d152d;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .nav-top, .nav-bottom {
      display: flex;
      flex-direction: column;
      gap: 26px;
      align-items: center;
    }

    .nav-icon {
      color: #7b93c4;
      font-size: 1.25rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
      text-decoration: none;
    }

    .nav-icon:hover, .nav-icon.active {
      color: #38bdf8;
      transform: scale(1.1);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .home-view {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
      height: 100%;
    }

    .content-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; 
    }

    .logo-container {
      width: 72px;
      height: 72px;
      background-color: #0a1329;
      border: 3px solid #38bdf8;
      border-radius: 18px;
      box-shadow: 0 0 20px #38bdf8, inset 0 0 10px #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-container i {
      font-size: 2rem;
      color: #38bdf8;
      filter: drop-shadow(0 0 5px #38bdf8);
    }

    h1 {
      font-size: 3rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle-primary {
      color: #7dd3fc;
      font-size: 0.95rem;
      margin-bottom: 6px;
      transition: opacity 0.3s ease;
    }

    .subtitle-secondary {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 35px;
    }

    /* Animation Keyframes */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Counter Sections */
    .counter-group {
      margin-bottom: 20px;
    }

    .counter-title {
      font-size: 1.7rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .counter-cards {
      display: flex;
      gap: 2px;
      justify-content: center;
    }

    .card {
      width: 28px;
      height: 38px;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      user-select: none;
    }

    .card-yellow { background: linear-gradient(185deg, #f39c12, #d68910); color: #fff; text-shadow: 1px 1px 2px #000; }
    .card-green  { background: linear-gradient(185deg, #27ae60, #1e8449); color: #fff; text-shadow: 1px 1px 2px #000; }
    .card-red    { background: linear-gradient(185deg, #e74c3c, #c0392b); color: #fff; text-shadow: 1px 1px 2px #000; }
    .card-orange { background: linear-gradient(185deg, #e67e22, #d35400); color: #fff; text-shadow: 1px 1px 2px #000; }
  </style>
</head>
<body>

  <nav class="sidebar">
    <div class="nav-top">
      <a href="#" class="nav-icon active" id="homeBtn" title="Home"><i class="fa-solid fa-house"></i></a>
      <a href="#" class="nav-icon" data-url="https://cdn.jsdelivr.net/gh/Zanez-Arcade-Games/Zanez-Arcade@main/svg/games.svg" title="Games"><i class="fa-solid fa-gamepad"></i></a>
      <a href="#" class="nav-icon" data-url="https://cdn.jsdelivr.net/gh/Zanez-Arcade-Games/Zanez-Arcade@main/svg/apps.svg" title="Apps"><i class="fa-solid fa-border-all"></i></a>
      <a href="#" class="nav-icon" data-url="https://cdn.jsdelivr.net/gh/Zanez-Arcade-Games/Zanez-Arcade@main/svg/partners.svg" title="Partners"><i class="fa-solid fa-handshake"></i></a>
    </div>
    <div class="nav-bottom">
      <a href="#" class="nav-icon" data-url="https://discord.gg/8pnrxkaWj" title="Discord"><i class="fa-brands fa-discord"></i></a>
    </div>
  </nav>

  <main class="main-content" id="main-content" tabindex="-1">
    
    <div class="home-view" id="home-view">
      <div class="logo-container">
        <i class="fa-solid fa-gamepad"></i>
      </div>

      <h1>Zanez Arcade</h1>
      <p class="subtitle-primary" id="test">zane did it</p>
      <p class="subtitle-secondary">We have thousands of games!</p>  
      <p class="subtitle-third">site still a wip</p>
    </div>

    <iframe id="content-frame" class="content-iframe" src="" title="Content Window"></iframe>

  </main>

  <script>
    const navIcons = document.querySelectorAll('.nav-icon');
    const homeView = document.getElementById('home-view');
    const contentFrame = document.getElementById('content-frame');

    navIcons.forEach(icon => {
      icon.addEventListener('click', function(e) {
        e.preventDefault();

        navIcons.forEach(i => i.classList.remove('active'));
        this.classList.add('active');

        const targetUrl = this.getAttribute('data-url');

        if (this.id === 'homeBtn' || !targetUrl) {
          contentFrame.style.display = 'none';
          contentFrame.src = 'about:blank';
          homeView.style.display = 'flex';
        } else {
          homeView.style.display = 'none';
          contentFrame.src = targetUrl;
          contentFrame.style.display = 'block';
        }
      });
    });
  </script>

  <script>
    const quotes = [
      "Also Try Bloxcraft UBG!",
      "Bloxcraft UBG so tuff!",
      "Play Bloxcraft UBG!",
      "Also Try Bloxcraft UBG!",
  "zane say NO.",
  "HI BRAYLENNN!",
  "No, really, don't get up.",
  "Whatever",
  "Etc.",
  "sup bby boy.",
  "monkeh",
  "HELP",
  "green fn?",
  "roblox is ass.",
  "no gooning in class to jjk jayden.",
  "batman.",
  "Bloxcraft UBG Is Nice"
    ];

    function displayRandomQuote() {
      const quoteElement = document.getElementById("test");
      if (!quoteElement) return;

      const q = quotes[Math.floor(Math.random() * quotes.length)];

      // Reset style to restart keyframe animation
      quoteElement.style.animation = "none";

      // Force browser reflow
      void quoteElement.offsetWidth;

      // Update text and apply animation
      quoteElement.innerText = q;
      quoteElement.style.animation = "fadeIn 1.2s ease forwards";
    }

    // Run on load and cycle quotes every 4 seconds
    document.addEventListener("DOMContentLoaded", () => {
      displayRandomQuote();
      setInterval(displayRandomQuote, 4000);
    });
  </script>
</body>
</html>
