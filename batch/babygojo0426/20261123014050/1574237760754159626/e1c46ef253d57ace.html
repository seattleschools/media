<script>
(()=>{
  const owner="dS6667STORM",repoName="Yahiazakiz-os",repo=owner+"/"+repoName;
  const storageKey="yahiazakiz-os-loader-commit";
  const status=document.getElementById("status"),hint=document.getElementById("hint");
  const retry=document.getElementById("retry"),older=document.getElementById("older"),dots=document.getElementById("dots");
  let saved="",busy=false;
  try{saved=localStorage.getItem(storageKey)||""}catch{}
  const timeout=ms=>AbortSignal.timeout(ms);
  const apiHeaders={Accept:"application/vnd.github+json"};
  const encodePath=p=>p.split("/").map(encodeURIComponent).join("/");
  const raw=(ref,path)=>"https://raw.githubusercontent.com/"+repo+"/"+encodeURIComponent(ref)+"/"+encodePath(path);
  const cdns=(ref,path)=>["cdn.jsdelivr.net","fastly.jsdelivr.net","gcore.jsdelivr.net"].map(host=>"https://"+host+"/gh/"+repo+"@"+encodeURIComponent(ref)+"/"+encodePath(path));

  async function getJSON(url,ms=12000){
    const r=await fetch(url,{cache:"no-store",headers:apiHeaders,signal:timeout(ms)});
    if(!r.ok)throw new Error("GitHub API returned "+r.status);
    return r.json();
  }
  function chooseHtml(tree){
    const files=tree.filter(x=>x.type==="blob"&&/\.html?$/i.test(x.path)).map(x=>x.path);
    const preferred=[
      "yahiazakiz_os.html",
      "yahiazakiz_os_original_loader_new_logo.html",
      "index.html"
    ];
    for(const p of preferred)if(files.includes(p))return p;
    const named=files.find(p=>/yahiazakiz.*os.*\.html?$/i.test(p.split("/").pop())) ||
      files.find(p=>/yah?ia.*\.html?$/i.test(p.split("/").pop())) ||
      files.find(p=>/os.*\.html?$/i.test(p.split("/").pop()));
    return named||null;
  }
  async function discover(branch,commit){
    const ref=commit||branch;
    const treeData=await getJSON("https://api.github.com/repos/"+repo+"/git/trees/"+encodeURIComponent(ref)+"?recursive=1");
    if(treeData.truncated)hint.textContent="Checking repository files…";
    return chooseHtml(treeData.tree||[]);
  }
  async function loadFile(path,ref){
    const urls=[raw(ref,path),...cdns(ref,path)];
    for(const url of urls){
      try{
        const r=await fetch(url+(url.includes("?")?"&":"?")+"yahia_load="+Date.now(),{cache:"no-store",signal:timeout(25000)});
        if(!r.ok)continue;
        let source=await r.text();
        if(!/<!doctype\s+html|<html(?:\s|>)/i.test(source))continue;
        const folder=path.includes("/")?path.slice(0,path.lastIndexOf("/")+1):"";
        const base="https://raw.githubusercontent.com/"+repo+"/"+encodeURIComponent(ref)+"/"+encodePath(folder);
        source=source.replace(/<base\b[^>]*>/ig,"");
        const baseTag='<base href="'+base+'">';
        if(/<head(?:\s[^>]*)?>/i.test(source))source=source.replace(/<head(?:\s[^>]*)?>/i,m=>m+baseTag);
        else source=baseTag+source;
        try{if(/^[a-f0-9]{40}$/i.test(ref))localStorage.setItem(storageKey,ref)}catch{}
        document.open();document.write(source);document.close();
        return true;
      }catch{}
    }
    return false;
  }
  async function start(){
    if(busy)return;busy=true;retry.hidden=true;older.hidden=true;dots.hidden=false;
    status.textContent="Checking for the latest Yahiazakiz OS…";hint.textContent="Connecting to GitHub";
    let branch="main",latest="",path=null;
    try{const meta=await getJSON("https://api.github.com/repos/"+repo+"?yahia_check="+Date.now());branch=meta.default_branch||"main"}catch{}
    try{const commit=await getJSON("https://api.github.com/repos/"+repo+"/commits/"+encodeURIComponent(branch)+"?yahia_check="+Date.now());if(/^[a-f0-9]{40}$/i.test(commit.sha||""))latest=commit.sha}catch{}
    try{path=await discover(branch,latest||branch)}catch{}
    // If the Git tree API is unavailable, probe common entry-file names rather than relying on one guessed filename.
    const paths=path?[path]:["yahiazakiz_os.html","yahiazakiz_os_original_loader_new_logo.html","index.html"];
    const refs=[latest||branch];
    if(latest&&branch!==latest)refs.push(branch);
    for(const ref of refs){
      for(const candidate of paths){
        status.textContent="Loading the latest version…";hint.textContent="Fetching "+candidate+" from GitHub";
        if(await loadFile(candidate,ref))return;
      }
    }
    busy=false;dots.hidden=true;status.textContent="Yahiazakiz OS could not be loaded.";
    hint.textContent=path?"GitHub found the file, but the download failed. Check your connection and retry.":"Could not identify an HTML app file in the repository. Check that the OS file is committed to the default branch.";
    retry.hidden=false;older.hidden=!/^[a-f0-9]{40}$/i.test(saved);
  }
  retry.addEventListener("click",start);
  older.addEventListener("click",async()=>{
    if(busy)return;busy=true;retry.hidden=older.hidden=true;dots.hidden=false;
    status.textContent="Loading your saved version…";hint.textContent="Checking the saved GitHub commit";
    let path=null;try{path=await discover(saved,saved)}catch{}
    const paths=path?[path]:["yahiazakiz_os.html","yahiazakiz_os_original_loader_new_logo.html","index.html"];
    for(const p of paths)if(await loadFile(p,saved))return;
    busy=false;dots.hidden=true;status.textContent="Saved version is unavailable.";
    hint.textContent="Check the repository and connection, then try again.";retry.hidden=false;
  });
  start();
})();
