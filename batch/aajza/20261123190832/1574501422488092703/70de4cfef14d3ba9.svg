<?xml version="1.0" encoding="UTF-8"?>
<!-- Wavey chps - SVG launcher. The app itself runs at https://waveychps-agxtne.skiffly.cloud/ -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" version="1.1"
     style="display:block;overflow:hidden;background:#0b0613">
  <title>Wavey chps</title>
  <desc>Wavey chps, running inside an SVG document.</desc>
  <rect x="0" y="0" width="100%" height="100%" fill="#0b0613"/>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:div style="display:block;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0b0613">
      <xhtml:iframe
        title="Wavey chps"
        src="https://waveychps-agxtne.skiffly.cloud/"
        style="display:block;width:100%;height:100%;border:0;background:#0b0613"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-read; clipboard-write"
        allowfullscreen="allowfullscreen"
        referrerpolicy="strict-origin-when-cross-origin"></xhtml:iframe>
    </xhtml:div>
  </foreignObject>
</svg>
