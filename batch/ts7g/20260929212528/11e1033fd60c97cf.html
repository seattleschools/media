<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Coursera | The best place to learn anything, anywhere">
  <link rel="apple-touch-icon" href="imgs/favicons/apple-touch-icon-v2-57x57.png">
  <link rel="icon" type="image/png" href="imgs/favicons/favicon.png">

  <title>Coursera | Online Courses</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('mochiiTheme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap">

  <style>
    :root {
      --bg-body: #050505;
      --bg-body-translucent: rgba(5,5,5,.79);
      --bg-grid: #181818;
      --surface-0: #060606;
      --surface-1: #0b0b0b;
      --surface-2: #0e0e0e;
      --surface-3: #111111;
      --surface-4: #141414;
      --surface-5: #181818;
      --surface-hover: #242424;
      --surface-active: #2b2b2b;
      --text-primary: #ebebeb;
      --text-secondary: #c8c8c8;
      --text-muted: #8c8c8c;
      --text-faint: #646464;
      --text-white: #fafafa;
      --border-subtle: rgba(255,255,255,.05);
      --border-faint: rgba(255,255,255,.10);
      --border-medium: #282828;
      --accent: #ffffff;
      --accent-soft: rgba(255,255,255,.08);
      --accent-active: rgba(255,255,255,.12);
      --input: #181818;
      --input-search: rgba(255,255,255,.02);
      --search-inset: #0d0d0d;
      --search-inset-focus: #111111;
      --search-glow: rgba(255,255,255,.16);
      --radius-detail: 4px;
      --radius-frame: 6px;
      --radius-item: 10px;
      --radius-control: 15px;
      --radius-panel: 15px;
      --radius-dialog: 20px;
      --radius-bar: 25px;
      --motion: cubic-bezier(.4,0,.2,1);
      --font: 'Lexend', sans-serif;
    }

    [data-theme="catppuccin"] {
      --bg-body:#1e1e2e; --surface-0:#1f1f30; --surface-1:#222235; --surface-2:#252539;
      --surface-3:#28283c; --surface-4:#2c2c43; --surface-5:#343448; --surface-hover:#45475a;
      --surface-active:#585b70; --text-primary:#dee4f8; --text-secondary:#bac2de; --text-muted:#808499;
      --text-faint:#656881; --accent:#cba6f7; --accent-soft:#cba6f718; --accent-active:#cba6f733;
      --input:#313244; --search-inset:#232336; --search-inset-focus:#2a2a40; --search-glow:#cba6f740;
      --border-faint:#45475a66; --border-medium:#45475a; --bg-grid:#313244;
    }
    [data-theme="dracula"] {
      --bg-body:#282a36; --surface-0:#292b37; --surface-1:#2d2f3c; --surface-2:#303240; --surface-3:#323543;
      --surface-4:#383b4a; --surface-5:#44475a; --surface-hover:#565970; --surface-active:#6272a4;
      --text-primary:#f8f8f2; --text-secondary:#d0cee0; --text-muted:#8892b4; --text-faint:#6272a4;
      --accent:#bd93f9; --accent-soft:#bd93f918; --accent-active:#bd93f933; --input:#44475a;
      --search-inset:#303240; --search-inset-focus:#383a4a; --search-glow:#bd93f940; --border-faint:#44475a88;
      --border-medium:#44475a; --bg-grid:#44475a;
    }
    [data-theme="synthwave"] {
      --bg-body:#13111c; --surface-0:#14111e; --surface-1:#181523; --surface-2:#1a1727; --surface-3:#1c192c;
      --surface-4:#211d33; --surface-5:#2d2848; --surface-hover:#4a3a66; --surface-active:#563f75;
      --text-primary:#eddef7; --text-secondary:#d0b8e0; --text-muted:#8d7b9e; --text-faint:#735e87;
      --accent:#ff7edb; --accent-soft:#ff7edb18; --accent-active:#ff7edb33; --input:#241b2f;
      --search-inset:#1c1928; --search-inset-focus:#241b2f; --search-glow:#ff7edb40; --border-faint:#3f315988;
      --border-medium:#3f3159; --bg-grid:#241b2f;
    }
    [data-theme="tokyo night"] {
      --bg-body:#1a1b26; --surface-0:#1c1d26; --surface-1:#1f202d; --surface-2:#22232f; --surface-3:#242534;
      --surface-4:#292e42; --surface-5:#30324c; --surface-hover:#565f89; --surface-active:#565f89;
      --text-primary:#dce1f9; --text-secondary:#bac1de; --text-muted:#727ca6; --text-faint:#58628d;
      --accent:#7aa2f7; --accent-soft:#7aa2f718; --accent-active:#7aa2f733; --input:#292e42;
      --search-inset:#24283b; --search-inset-focus:#292e42; --search-glow:#7aa2f740; --border-faint:#3b426188;
      --border-medium:#3b4261; --bg-grid:#292e42;
    }
    [data-theme="everforest"] {
      --bg-body:#272e33; --surface-0:#282f35; --surface-1:#2c3439; --surface-2:#2e373d; --surface-3:#313a40;
      --surface-4:#384046; --surface-5:#465057; --surface-hover:#56636a; --surface-active:#5d6b72;
      --text-primary:#f1ede4; --text-secondary:#dad2be; --text-muted:#878d92; --text-faint:#6c7972;
      --accent:#a7c080; --accent-soft:#a7c08018; --accent-active:#a7c08033; --input:#374145;
      --search-inset:#2e383c; --search-inset-focus:#374145; --search-glow:#a7c08040; --border-faint:#4a555b88;
      --border-medium:#4a555b; --bg-grid:#374145;
    }
    [data-theme="kanagawa"] {
      --bg-body:#1f1f28; --surface-0:#20202a; --surface-1:#24242e; --surface-2:#262632; --surface-3:#292936;
      --surface-4:#2e2e3c; --surface-5:#3b3b4e; --surface-hover:#54546d; --surface-active:#625e7e;
      --text-primary:#f1efe4; --text-secondary:#ddd8bb; --text-muted:#888891; --text-faint:#646482;
      --accent:#7e9cd8; --accent-soft:#7e9cd818; --accent-active:#7e9cd833; --input:#363646;
      --search-inset:#2a2a37; --search-inset-focus:#363646; --search-glow:#7e9cd840; --border-faint:#45455a88;
      --border-medium:#45455a; --bg-grid:#2a2a37;
    }
    [data-theme="solarized"] {
      --bg-body:#002b36; --surface-0:#002d39; --surface-1:#003441; --surface-2:#003947; --surface-3:#073a46;
      --surface-4:#0a4250; --surface-5:#185260; --surface-hover:#2a6678; --surface-active:#35778a;
      --text-primary:#e9ecec; --text-secondary:#c8cfd0; --text-muted:#7c959c; --text-faint:#607b85;
      --accent:#268bd2; --accent-soft:#268bd218; --accent-active:#268bd233; --input:#0a4050;
      --search-inset:#073642; --search-inset-focus:#0a4050; --search-glow:#268bd240; --border-faint:#1a556688;
      --border-medium:#1a5566; --bg-grid:#073642;
    }
    [data-theme="sakura"] {
      --bg-body:#120a10; --surface-0:#130b11; --surface-1:#190e16; --surface-2:#1d101a; --surface-3:#1e151c;
      --surface-4:#261a23; --surface-5:#362833; --surface-hover:#4a3848; --surface-active:#553f55;
      --text-primary:#f2e4ec; --text-secondary:#d8c0d0; --text-muted:#988096; --text-faint:#836380;
      --accent:#ff69b4; --accent-soft:#ff69b418; --accent-active:#ff69b433; --input:#261a26;
      --search-inset:#1c1218; --search-inset-focus:#261a26; --search-glow:#ff69b440; --border-faint:#3a283888;
      --border-medium:#3a2838; --bg-grid:#221822;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
      background:var(--bg-body);
      color:var(--text-primary);
      font-family:var(--font);
      text-transform:lowercase;
      -webkit-font-smoothing:antialiased;
    }
    button, input, select { font:inherit; text-transform:lowercase; }
    button, a { -webkit-tap-highlight-color:transparent; }
    ::selection { background:var(--accent); color:var(--bg-body); }
    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#4e4e4e; border-radius:999px; }
    ::-webkit-scrollbar-thumb:hover { background:#707070; }
    * { scrollbar-width:thin; scrollbar-color:#4e4e4e transparent; }

    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fade-in { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
    @keyframes modal-in { from { opacity:0; transform:translate(-50%,-50%) scale(.94); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
    @keyframes modal-out { from { opacity:1; transform:translate(-50%,-50%) scale(1); } to { opacity:0; transform:translate(-50%,-50%) scale(.94); } }
    @keyframes skeleton { to { transform:translateX(-100%); } }
    @keyframes modal-pop { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:none; } }
    @keyframes soft-rise { from { opacity:0; transform:translateY(12px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes soft-pop { 0% { opacity:0; transform:scale(.92); } 70% { opacity:1; transform:scale(1.025); } 100% { transform:scale(1); } }
    @keyframes chrome-in { from { opacity:0; transform:translateY(-10px); filter:blur(5px); } to { opacity:1; transform:none; filter:none; } }
    @keyframes sidebar-in { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
    @keyframes tab-in { from { opacity:0; transform:translateX(-7px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes page-in { from { opacity:0; transform:scale(.992); } to { opacity:1; transform:scale(1); } }
    @keyframes glow-drift { 0%,100% { transform:translate3d(-2%,0,0) scale(1); opacity:.32; } 50% { transform:translate3d(2%,1%,0) scale(1.06); opacity:.48; } }
    @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
    @keyframes button-bounce { 0% { transform:scale(1); } 45% { transform:scale(.94); } 100% { transform:scale(1); } }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { scroll-behavior:auto!important; transition-duration:.001ms!important; animation-duration:.001ms!important; animation-iteration-count:1!important; }
    }

    :root { --motion-fast:.12s; --motion-med:.22s; --motion-slow:.38s; --hover-scale:1.035; --radius-mult:1; }
    html.motion-subtle { --motion-fast:.08s; --motion-med:.15s; --motion-slow:.24s; --hover-scale:1.02; }
    html.motion-off { --motion-fast:.001s; --motion-med:.001s; --motion-slow:.001s; --hover-scale:1; }
    html.motion-off *, html.motion-off *::before, html.motion-off *::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
    html.grid-off .iframe-container { background:var(--bg-body); }
    html.glow-on .iframe-container::before { content:""; position:absolute; inset:-22%; pointer-events:none; z-index:0; background:radial-gradient(circle at 50% 44%, var(--accent-soft), transparent 42%); filter:blur(34px); animation:glow-drift 9s ease-in-out infinite; opacity:.8; }
    html.glow-on .iframe-container iframe, html.glow-on .iframe-container > .message-container, html.glow-on .iframe-container > .loading-bar-container { z-index:1; }
    html.compact-ui .browser-sidebar:not(.hidden) { width:194px; flex-basis:194px; }
    html.compact-ui .tab { padding:7px 8px; min-height:34px; }
    html.compact-ui .main-nav { min-height:50px; padding:6px 8px; }
    html.no-hover .tab:hover, html.no-hover .pill:hover, html.no-hover .proxy-action:hover, html.no-hover .chrome-icon:hover { transform:none; }

    /* ---------- app shell ---------- */
    #proxy-content { width:100%; height:100%; display:flex; overflow:hidden; }
    #proxy-app { width:100%; height:100%; display:flex; min-width:0; overflow:hidden; }
    .browser-container { width:100%; height:100%; display:flex; overflow:hidden; background:var(--bg-body); }

    .build-and-discord {
      position: fixed;
      bottom: 6px;
      right: 6px;
      font-size: 8px;
      opacity: 0.5;
    }

    a {
      color: inherit;
    }
    /* ---------- lyra-like sidebar ---------- */
    .browser-sidebar {
      width:220px;
      flex:0 0 220px;
      padding:10px;
      display:flex;
      flex-direction:column;
      height:100%;
      background:var(--surface-0);
      border-right:1px solid var(--border-subtle);
      transition:margin-left .14s var(--motion), opacity .14s var(--motion), width .14s var(--motion);
      overflow:hidden;
      z-index:20;
    }
    .browser-sidebar.hidden {
      width:0;
      flex-basis:0;
      padding-left:0;
      padding-right:0;
      margin-left:-1px;
      opacity:0;
      pointer-events:none;
    }
    .sidebar-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:16px;
      padding:4px 2px;
    }
    .sidebar-brand { color:var(--text-white); font-size:15px; font-weight:400; letter-spacing:.01em; }
    .sidebar-brand span { color:var(--text-muted); margin-left:3px; }
    .sidebar-mini-btn,
    .chrome-icon,
    .new-tab-btn {
      border:0;
      color:var(--text-muted);
      background:transparent;
      width:30px;
      height:30px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:background-color var(--motion-fast), color var(--motion-fast), transform var(--motion-fast);
    }
    .sidebar-mini-btn:hover,
    .chrome-icon:hover,
    .new-tab-btn:hover { background:var(--accent-soft); color:var(--text-white); transform:scale(var(--hover-scale)); }
    .sidebar-label { color:var(--text-faint); font-size:12px; padding:0 8px 7px; }
    .tabs-container { display:flex; flex-direction:column; gap:5px; overflow:auto; flex:1; padding:0 1px; }
    .tab {
      position:relative;
      width:100%;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 10px;
      min-height:38px;
      border-radius:var(--radius-control);
      color:var(--text-muted);
      background:transparent;
      cursor:pointer;
      user-select:none;
      overflow:hidden;
      transition:background-color var(--motion-fast), color var(--motion-fast), transform var(--motion-fast);
    }
    .tab:hover { background:var(--accent-soft); color:var(--text-white); transform:scale(var(--hover-scale)); }
    .tab.active { background:var(--accent-active); color:var(--text-white); }
    .tab.drag-over { outline:1px solid var(--accent); }
    .tab-favicon { width:16px; height:16px; flex:0 0 16px; border-radius:var(--radius-detail); object-fit:contain; }
    .tab-title { min-width:0; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:13px; }
    .tab-close {
      opacity:0;
      width:24px;
      height:24px;
      flex:0 0 24px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      color:var(--text-muted);
      font-size:16px;
      line-height:1;
      transition:opacity var(--motion-fast), background-color var(--motion-fast), color var(--motion-fast), transform var(--motion-fast);
    }
    .tab:hover .tab-close, .tab.active .tab-close { opacity:.7; }
    .tab-close:hover { opacity:1!important; color:var(--text-white); background:var(--accent-soft); transform:scale(var(--hover-scale)); }
    .tab-spinner { width:14px; height:14px; border:2px solid var(--border-faint); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:0 0 14px; }
    .sidebar-footer { display:flex; align-items:center; gap:8px; padding:8px 5px 2px; color:var(--text-faint); font-size:10px; }

    /* ---------- chrome ---------- */
    .content-area { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-body); }
    .main-nav {
      min-height:56px;
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:8px;
      background:var(--surface-0);
      border-bottom:1px solid var(--border-subtle);
      z-index:15;
    }
    .nav-controls, .window-controls { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
    .chrome-icon {
      text-decoration:none;
      font-size:14px;
    }
    .chrome-icon.disabled { opacity:.25; pointer-events:none; }
    .chrome-icon svg, .sidebar-mini-btn svg, .new-tab-btn svg, .proxy-action svg { width:17px; height:17px; }
    .omnibox { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; }
    .omnibox-input-wrap {
      width:min(700px, 100%);
      position:relative;
      display:flex;
      align-items:center;
    }
    .omnibox input {
      width:100%;
      height:36px;
      border:1px solid transparent;
      outline:none;
      border-radius:var(--radius-bar);
      background:var(--input-search);
      color:var(--text-secondary);
      padding:0 15px 0 40px;
      font-size:12px;
      caret-color:var(--accent);text-transform:none;
      transition:background-color .1s, border-color .1s, color .1s;
    }
    .omnibox input:hover { background:rgba(255,255,255,.045); }
    .omnibox input:focus { background:rgba(255,255,255,.055); border-color:var(--border-faint); color:var(--text-primary); }
    .omnibox input::placeholder { color:var(--text-muted); opacity:.65; font-weight:300; }
    .omnibox-icon { position:absolute; left:10px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); z-index:2; pointer-events:none; }
    .omnibox-icon svg { width:17px; height:17px; }
    .proxy-actions { display:flex; align-items:center; gap:4px; }
    .proxy-action {
      width:30px; height:30px; border:0; border-radius:50%; background:transparent; color:var(--text-muted);
      display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--motion-fast);
    }
    .proxy-action:hover { background:var(--accent-soft); color:var(--text-white); transform:scale(1.05); }

    /* ---------- main browser area ---------- */
    .iframe-container {
      position:relative;
      flex:1;
      min-height:0;
      width:calc(100% - 10px);
      height:100%;
      margin:0 5px 5px;
      border-radius:var(--radius-frame);
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.02), transparent 55%),
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        var(--bg-body);
      background-size:100% 100%,20px 20px,20px 20px,auto;
      border:1px solid var(--border-medium);
    }
    .iframe-container iframe {
      position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:transparent;
      transition:filter .18s var(--motion), opacity .18s var(--motion);
    }
    .iframe-container iframe.hidden { display:none; }
    .iframe-container iframe.loading { filter:blur(10px); opacity:.82; }
    .browser-container.browsing-mode .main-nav { animation:chrome-in var(--motion-med) var(--motion) both; }
    .browser-container.browsing-mode .browser-sidebar:not(.hidden) { animation:sidebar-in var(--motion-med) var(--motion) both; }
    .browser-container.browsing-mode .tab { animation:tab-in var(--motion-med) var(--motion) both; }
    .iframe-container iframe:not(.hidden) { animation:page-in var(--motion-med) var(--motion) both; }

    /* the search homepage is the app's default surface; browser chrome only
       appears once an external/proxied destination is actually opened */
    .browser-container.landing-mode .browser-sidebar,
    .browser-container.landing-mode .main-nav { display:none !important; }
    .browser-container.landing-mode .content-area { flex:1 1 100%; }
    .browser-container.landing-mode .content-area { width:100%; }
    .browser-container.landing-mode .iframe-container {
      width:100%; height:100%; margin:0; border:0; border-radius:0;
    }
    .loading-bar-container { position:absolute; top:0; left:0; right:0; height:2px; z-index:25; pointer-events:none; }
    .loading-bar { width:0; height:100%; background:var(--accent); opacity:0; transition:width .2s, opacity .15s; }

    /* ---------- overlays ---------- */
    .message-container {
      position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.78); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    }
    .message-content {
      width:min(410px, calc(100% - 32px)); padding:26px 28px; border:1px solid var(--border-faint);
      border-radius:var(--radius-dialog); background:var(--surface-2); text-align:center; animation:fade-in .18s ease;
    }
    .message-content h1 { color:var(--text-primary); font-size:16px; font-weight:500; margin-bottom:8px; }
    .message-content p { color:var(--text-muted); font-size:12px; line-height:1.7; word-break:break-word; }
    .spinner { width:26px; height:26px; margin:0 auto 16px; border:2px solid var(--border-faint); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    .message-button {
      margin-top:16px; padding:9px 14px; border:0; border-radius:var(--radius-control); background:var(--surface-4);
      color:var(--text-secondary); cursor:pointer; font-size:12px; transition:.1s;
    }
    .message-button:hover { background:var(--surface-hover); color:var(--text-white); transform:scale(1.03); }

    /* ---------- settings ---------- */
    .wisp-settings-modal {
      position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.80); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); animation:fade-in .12s ease;
    }
    .wisp-settings-modal.hidden { display:none; }
    .proxy-wisp-card {
      width:min(540px, calc(100% - 32px)); max-height:82vh; display:flex; flex-direction:column; overflow:hidden;

        const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))];

        --surface-5:#181818;--surface-hover:#242424;--text-primary:#ebebeb;--text-secondary:#c8c8c8;--text-muted:#8c8c8c;
        --text-faint:#646464;--text-white:#fafafa;--border-subtle:rgba(255,255,255,.05);--border-faint:rgba(255,255,255,.1);
        --accent:#fff;--accent-soft:rgba(255,255,255,.08);--accent-active:rgba(255,255,255,.12);--input:#181818;
        --search-inset:#0d0d0d;--search-inset-focus:#111;--search-glow:rgba(255,255,255,.16)}
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{width:100%;height:100%}
      body{background:var(--bg-body);color:var(--text-primary);font-family:var(--font),'Lexend',sans-serif;text-transform:lowercase;
        -webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
      button,input{font:inherit;color:inherit;text-transform:lowercase}
      button{border:0;background:none;cursor:pointer}
      ::selection{background:var(--accent);color:var(--bg-body)}
      ::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#4e4e4e;border-radius:999px}
      *{scrollbar-width:thin;scrollbar-color:#4e4e4e transparent}
      .topbar{position:absolute;top:18px;left:20px;right:20px;display:flex;align-items:center;gap:8px;z-index:5}
      .spacer{flex:1}
      .pill{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--radius-bar);
        background:var(--surface-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-size:14px;transition:.1s}
      .pill:hover{background:var(--surface-5);transform:scale(1.04)}
      .pill.on{background:var(--accent-active);border-color:var(--border-faint)}
      .pill.round{width:40px;padding:0;color:var(--text-secondary)}
      .pill.round:hover{color:var(--text-white)}
      .brand-pill{gap:7px;overflow:hidden}
      .brand-cat{width:24px;height:24px;flex:0 0 24px;background-image:url('${ONEKO_CAT_URL}');
        background-repeat:no-repeat;background-size:192px 96px;background-position:-72px -72px;image-rendering:pixelated;pointer-events:none}
      .searchbar{position:relative;width:100%}
      .searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
      .searchbar input{width:100%;height:50px;padding:0 18px 0 46px;background:var(--search-inset);border:1px solid var(--border-subtle);
        border-radius:var(--radius-bar);outline:none;font-size:14px;transition:.15s}
      .searchbar input:focus{background:var(--search-inset-focus);border-color:var(--border-faint)}
      .searchbar input::placeholder{color:var(--text-faint)}
      .scroll{position:absolute;inset:0;overflow:auto;padding:80px 24px 32px}
      .wrap{max-width:1100px;margin:0 auto}
      .tools{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:8px auto 22px}
      .status{color:var(--text-faint);font-size:11px;padding:0 6px;min-height:14px}
      .empty{grid-column:1/-1;text-align:center;color:var(--text-faint);font-size:13px;padding:40px 0}
      .grid{display:grid;gap:12px}
      .card{position:relative;overflow:hidden;border-radius:var(--radius-panel);background:var(--surface-3);
        border:1px solid var(--border-subtle);cursor:pointer;transition:.1s}
      .card:hover{transform:scale(1.03);border-color:var(--border-faint)}
      .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:300;color:var(--text-faint)}
      .card .nm{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;font-size:12px;color:#fff;
        background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      @media (max-width:560px){.topbar{left:12px;right:12px}.scroll{padding:74px 14px 24px}.games-grid,.anime-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
    `;

    function baseScript(cfg) {
      const post = m => { if (window.parent !== window) window.parent.postMessage(m, '*'); };
      window.nav = url => post({ type: 'navigate', url });
      window.openTab = url => post({ type: 'gl_open_tab', url });
      window.pick = a => a[Math.floor(Math.random() * a.length)];
      window.bmLoad = () => {
        try { return JSON.parse(localStorage.getItem('gl_shortcuts') || 'null') || cfg.bookmarks; }
        catch { return cfg.bookmarks; }
      };
      window.bmSave = list => { try { localStorage.setItem('gl_shortcuts', JSON.stringify(list)); } catch {} };
      window.favicon = url => {
        try { return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(new URL(url).hostname) + '&sz=64'; }
        catch { return ''; }
      };
      document.addEventListener('click', e => {
        const p = e.target.closest('[data-page]');
        if (p) { e.preventDefault(); post({ type: 'gl_page', page: p.dataset.page }); return; }
        if (e.target.closest('[data-settings]')) post({ type: 'gl_settings' });
      });
      window.addEventListener('message', e => {
        if (!e.data || e.data.type !== 'GHOSTLINK_NT_THEME') return;
        const r = document.documentElement;
        for (const [k, v] of Object.entries(e.data.vars || {})) if (v) r.style.setProperty(k, v);
      });
      post({ type: 'GHOSTLINK_NT_READY' });
    }

    function pageShell(cfg, title, body, script, css = '') {
      return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title} | mochii!</title>${window.__fontHead || ''}<style>${PAGE_CSS}${css}</style>
<script>(function(){var r=document.documentElement,t=${JSON.stringify(readThemeVars())};for(var k in t)if(t[k])r.style.setProperty(k,t[k]);})();<\/script>
</head><body>${body}
<script>window.__CFG=${JSON.stringify(cfg)};(${baseScript.toString()})(window.__CFG);<\/script>
<script>(${script.toString()})(window.__CFG);<\/script></body></html>`;
    }

    function topbar(active, cfg, brand) {
      const btn = (p, label) => `<button class="pill round${active === p ? ' on' : ''}" data-page="${p}" title="${label}" aria-label="${label}">${pgIcon(p)}</button>`;
      return `<div class="topbar"><button class="pill brand-pill" data-page="home"><span>${escapeHtml(brand || cfg.brand)}</span><span class="brand-cat" aria-hidden="true"></span></button>${btn('games', 'games')}${btn('anime', 'anime')}${btn('chat', 'chat')}<div class="spacer"></div><button class="pill round" data-settings title="settings" aria-label="settings">${pgIcon('settings')}</button></div>`;
    }

      const css = `

        .center>*{flex:0 0 auto;animation:soft-rise var(--motion-slow) var(--motion) both}

        .center > .bm{animation-delay:.14s}
        .splash{height:clamp(80px,15vh,140px);max-width:220px;object-fit:contain;margin-bottom:18px;user-select:none;-webkit-user-drag:none}
        .home-search{width:min(520px,100%)}
        .bm{width:min(520px,100%);margin-top:26px}
        .bm-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:0 4px}
        .bm-head h2{font-size:15px;font-weight:400;color:var(--text-muted)}
        .chip{padding:6px 14px;border-radius:var(--radius-bar);background:var(--surface-3);color:var(--text-muted);font-size:12px;transition:.1s}
        .chip:hover,.chip.on{background:var(--surface-5);color:var(--text-white)}
        .bm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
        .tile{position:relative;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;

        .tile .ic img{width:20px;height:20px;object-fit:contain}

        .tile .rm{display:none;position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--surface-hover);color:var(--text-white);align-items:center;justify-content:center}
        body.editing .tile .rm{display:flex}
        .add-form{display:none;gap:6px;margin-bottom:12px}
        body.editing .add-form{display:flex}
        .add-form input{flex:1;min-width:0;height:36px;padding:0 12px;border-radius:var(--radius-control);border:1px solid var(--border-subtle);background:var(--input);outline:none;font-size:12px}
        .add-form input:focus{border-color:var(--border-faint)}
        .add-form button{padding:0 14px;height:36px;border-radius:var(--radius-control);background:var(--accent);color:var(--bg-body);font-size:12px}
      `;
      const body = `${topbar('home', cfg)}
        <main class="center">
          <img class="splash" id="splash" alt="">
          <form class="searchbar home-search" id="f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${PG_ICONS.search}</svg>
            <input id="q" type="text" autocomplete="off" spellcheck="false" aria-label="search or enter url"></form>
          <section class="bm">
            <div class="bm-head"><h2>bookmarks</h2><button class="chip" id="edit" type="button">edit</button></div>
            <form class="add-form" id="add"><input name="label" placeholder="name" spellcheck="false"><input name="url" placeholder="url" spellcheck="false"><button type="submit">add</button></form>
            <div class="bm-grid" id="bm"></div>
          </section>
        </main>`;
      const script = function (cfg) {
        const q = document.getElementById('q');
        const img = document.getElementById('splash');
        if (cfg.splashImages.length) {
          img.onerror = () => { img.style.display = 'none'; };
          img.src = pick(cfg.splashImages);
        } else img.style.display = 'none';
        q.placeholder = pick(cfg.splashes);
        document.getElementById('f').addEventListener('submit', e => {
          e.preventDefault();
          const v = q.value.trim();
          if (v) nav(v);
        });
        const grid = document.getElementById('bm');
        const edit = document.getElementById('edit');
        function render() {
          grid.innerHTML = '';
          bmLoad().forEach((b, i) => {
            const t = document.createElement('div');
            t.className = 'tile';
            t.setAttribute('role', 'button');
            t.tabIndex = 0;
            const ic = document.createElement('div');
            ic.className = 'ic';
            const im = document.createElement('img');
            im.alt = '';
            im.src = favicon(b.url);
            im.onerror = () => { ic.textContent = (b.label || '?')[0]; };
            ic.appendChild(im);
            const lb = document.createElement('span');
            lb.className = 'lb';
            lb.textContent = b.label;
            const rm = document.createElement('button');
            rm.className = 'rm';
            rm.type = 'button';
            rm.setAttribute('aria-label', 'remove');
            rm.textContent = '×';
            rm.onclick = e => { e.stopPropagation(); const l = bmLoad(); l.splice(i, 1); bmSave(l); render(); };
            t.append(ic, lb, rm);
            t.onclick = () => { if (!document.body.classList.contains('editing')) nav(b.url); };
            t.onkeydown = e => { if (e.key === 'Enter') t.onclick(); };
            grid.appendChild(t);
          });
        }
        edit.onclick = () => {
          const on = document.body.classList.toggle('editing');
          edit.classList.toggle('on', on);
          edit.textContent = on ? 'done' : 'edit';
        };
        document.getElementById('add').addEventListener('submit', e => {
          e.preventDefault();
          const f = e.target;
          let url = f.url.value.trim();
          const label = f.label.value.trim();
          if (!url) return;
          if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
          let host = label;
          try { host = label || new URL(url).hostname.replace(/^www\./, ''); } catch { return; }
          const l = bmLoad();
          l.push({ label: host, url });
          bmSave(l);
          f.reset();
          render();
        });
        render();
        q.focus();
      };
      return pageShell(cfg, 'home', body, script, css);
    }

    function pageGames(cfg) {
      const css = `
        .player{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--bg-body)}
        .player.open{display:flex}
        .p-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-subtle);background:var(--surface-0)}
        .p-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text-secondary)}
        .p-bar .pill{height:34px;width:34px}
        .player iframe{flex:1;width:100%;border:0;background:#000}
      `;
      const body = `${topbar('games', cfg)}
        <div class="scroll" id="scroll"><div class="wrap">
          <div class="tools">
            <div class="searchbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${PG_ICONS.search}</svg>
              <input id="q" type="text" placeholder="search games" autocomplete="off" spellcheck="false"></div>
            <div class="status" id="status">loading games...</div>
          </div>
          <div class="grid games-grid" id="grid"></div>
          <div id="sentinel" style="height:1px"></div>
        </div></div>
        <div class="player" id="player">
          <div class="p-bar"><span class="p-title" id="ptitle"></span>
            <button class="pill round" id="pfull" title="fullscreen" aria-label="fullscreen">${pgIcon('full', 16)}</button>
            <button class="pill round" id="pclose" title="close" aria-label="close">${pgIcon('close', 16)}</button></div>
          <iframe id="pframe" allow="autoplay; fullscreen; pointer-lock; gamepad; clipboard-write" allowfullscreen></iframe>
        </div>`;
      const script = async function (cfg) {
        const $ = id => document.getElementById(id);
        const grid = $('grid'), status = $('status'), q = $('q');
        const CHUNK = 90;
        let all = [], view = [], shown = 0, luminReady = false, luminCount = 0, gnCount = 0;
        const seen = new Set();
        const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');

        function add(list) {
          for (const g of list) {
            const k = norm(g.name);
            if (!k || seen.has(k)) continue;
            seen.add(k);
            all.push(g);
          }
          all.sort((a, b) => a.name.localeCompare(b.name));
          applyFilter();
        }

        function updateStatus() {
          status.textContent = view.length + ' games' + (q.value.trim() ? ' found' : '');
        }

        function applyFilter() {
          const s = q.value.trim().toLowerCase();
          view = s ? all.filter(g => g.name.toLowerCase().includes(s)) : all;
          grid.innerHTML = '';
          shown = 0;
          more();
          updateStatus();
          if (!view.length) grid.innerHTML = '<div class="empty">no games found</div>';
        }

        const io = new IntersectionObserver(entries => {
          for (const e of entries) {
            if (!e.isIntersecting) continue;
            io.unobserve(e.target);
            loadImg(e.target);
          }
        }, { root: $('scroll'), rootMargin: '300px' });

        async function loadImg(card) {
          const g = card._g, img = card.querySelector('img');
          try {
            if (g.src === 'gn') img.src = g.cover;
            else img.src = await Lumin.getImageUrl(g.token);
          } catch { img.remove(); }
        }

        function more() {
          const end = Math.min(shown + CHUNK, view.length);
          for (; shown < end; shown++) {
            const g = view[shown];
            const c = document.createElement('div');
            c.className = 'card';
            c.setAttribute('role', 'button');
            c.tabIndex = 0;
            c._g = g;
            const ph = document.createElement('div');
            ph.className = 'ph';
            ph.textContent = g.name[0] || '?';
            const im = document.createElement('img');
            im.alt = '';
            im.loading = 'lazy';
            im.onerror = () => im.remove();
            const nm = document.createElement('div');
            nm.className = 'nm';
            nm.textContent = g.name;
            c.append(ph, im, nm);
            c.onclick = () => play(g);
            c.onkeydown = e => { if (e.key === 'Enter') play(g); };
            grid.appendChild(c);
            io.observe(c);
          }
        }

        new IntersectionObserver(es => { if (es[0].isIntersecting && shown < view.length) more(); }, { root: $('scroll'), rootMargin: '600px' })
          .observe($('sentinel'));

        let t;
        q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(applyFilter, 120); });

        const player = $('player'), pframe = $('pframe');
        function closePlayer() { player.classList.remove('open'); pframe.removeAttribute('srcdoc'); pframe.src = 'about:blank'; }
        $('pclose').onclick = closePlayer;
        $('pfull').onclick = () => { (pframe.requestFullscreen || pframe.webkitRequestFullscreen || (() => {})).call(pframe); };
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && player.classList.contains('open')) closePlayer(); });

        async function play(g) {
          $('ptitle').textContent = g.name;
          try {
            if (g.src === 'gn') {
              if (/^https?:/i.test(g.url)) { nav(g.url); return; }
              player.classList.add('open');
              const url = g.url.replace('{COVER_URL}', cfg.gn.cover).replace('{HTML_URL}', cfg.gn.html);
              const html = await (await fetch(url + '?t=' + Date.now())).text();
              pframe.removeAttribute('src');
              pframe.srcdoc = html;
            } else {
              player.classList.add('open');
              const { url } = await Lumin.getGameUrl(g.id);
              pframe.removeAttribute('srcdoc');
              pframe.src = url;
            }
          } catch (err) {
            closePlayer();
            status.textContent = 'could not load ' + g.name;
          }
        }

        async function loadGn() {
          const zones = await (await fetch(cfg.gn.zones + '?t=' + Date.now())).json();
          const list = zones.slice(1).filter(z => z && z.name && z.url).map(z => ({
            src: 'gn', id: z.id, name: z.name, url: z.url,
            cover: String(z.cover || '').replace('{COVER_URL}', cfg.gn.cover).replace('{HTML_URL}', cfg.gn.html)
          }));
          gnCount = list.length;
          add(list);
        }

        async function loadLumin() {
          await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = cfg.luminScript;
            s.onload = res;
            s.onerror = () => rej(new Error('lumin script blocked'));
            document.head.appendChild(s);
          });
          await Lumin.init({ headless: true });
          luminReady = true;
          const first = await Lumin.getGames({ page: 1, limit: 100 });
          const map = r => r.games.map(g => ({ src: 'lumin', id: g.id, name: g.name, token: g.image_token }));
          let list = map(first);
          add(list);
          luminCount += list.length;
          for (let p = 2; p <= (first.pages || 1); p++) {
            const r = await Lumin.getGames({ page: p, limit: 100 });
            list = map(r);
            luminCount += list.length;
            add(list);
          }
        }

        const results = await Promise.allSettled([loadGn(), loadLumin()]);
        updateStatus();
        const failed = [];
        if (results[0].status === 'rejected') failed.push('gn-math');
        if (results[1].status === 'rejected') failed.push('lumin');
        if (failed.length) status.textContent += ' (' + failed.join(' + ') + ' failed to load)';
      };
      return pageShell(Object.assign({}, cfg, { gn: { zones: GN_ZONES_URL, cover: GN_COVER_URL, html: GN_HTML_URL }, luminScript: LUMIN_SCRIPT }), 'games', body, script, css);
    }

    function pageAnime(cfg) {
      const css = `
        .anime-wrap{max-width:1180px}
        .anime-tools{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:8px auto 22px}
        .anime-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px;min-height:15px}
        .anime-refresh{padding:6px 10px;border:1px solid var(--border-subtle);border-radius:var(--radius-bar);background:var(--surface-2);color:var(--text-muted);font-size:10px;cursor:pointer;transition:.1s}

        .anime-link:hover{background:var(--surface-4);border-color:var(--border-faint);transform:translateY(-1px)}
        .anime-link-main{min-width:0}.anime-link-title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.anime-link-site{margin-top:3px;font-size:9px;color:var(--text-faint)}
        .anime-link-arrow{color:var(--text-muted);font-size:14px}

        .anime-modal-actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 14px}
        .anime-modal-action{padding:8px 11px;border-radius:var(--radius-control);border:1px solid var(--border-subtle);background:var(--surface-2);color:var(--text-secondary);font-size:10px;cursor:pointer;text-decoration:none}
        .anime-modal-action:hover{background:var(--surface-4);color:var(--text-primary)}
        @media (max-width:560px){.anime-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}.anime-grid .card{height:clamp(210px,52vw,290px)}}
      `;

      const body = `${topbar('anime', cfg)}
        <div class="scroll"><div class="wrap anime-wrap">
          <div class="anime-tools">
            <div class="searchbar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${PG_ICONS.search}</svg>
              <input id="q" type="text" placeholder="search anime" autocomplete="off" spellcheck="false">
            </div>
            <div class="anime-meta">
              <div class="status" id="status">loading anime...</div>
              <button class="anime-refresh" id="refresh" type="button">refresh</button>
            </div>
          </div>
          <div class="grid anime-grid" id="grid"></div>
        </div></div>
        <div class="anime-modal hidden" id="anime-modal">
          <div class="anime-modal-card" role="dialog" aria-modal="true" aria-labelledby="anime-modal-title">
            <div class="anime-modal-head">
              <div><div class="anime-modal-title" id="anime-modal-title">watch anime</div><div class="anime-modal-sub" id="anime-modal-sub">loading official streaming links...</div></div>
              <button class="anime-modal-close" id="anime-modal-close" aria-label="close">×</button>
            </div>
            <div class="anime-modal-body" id="anime-modal-body"></div>
            <div class="anime-modal-actions" id="anime-modal-actions"></div>
          </div>
        </div>`;

      const script = function (cfg) {
        const grid = document.getElementById('grid');
        const q = document.getElementById('q');
        const status = document.getElementById('status');
        const refresh = document.getElementById('refresh');
        const modal = document.getElementById('anime-modal');
        const modalClose = document.getElementById('anime-modal-close');
        const modalTitle = document.getElementById('anime-modal-title');
        const modalSub = document.getElementById('anime-modal-sub');
        const modalBody = document.getElementById('anime-modal-body');
        const modalActions = document.getElementById('anime-modal-actions');

        const CACHE_KEY = 'mochiiAnimeCacheV3';
        const CACHE_TTL = 10 * 60 * 1000;
        const PER_SOURCE = 24;
        let all = [];
        let refreshToken = 0;

        function normalizeTitle(value) {
          return String(value || '').normalize('NFKC').toLowerCase()
            .replace(/[’'":.!?,()[\]{}]/g, ' ')
            .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
        }
        function pickTitle(t) {
          return String(t?.english || t?.romaji || t?.canonical || t?.default || t?.native || t?.ja_jp || t?.en || t?.en_us || '').trim();
        }
        function safeYear(value) { const n=Number(value); return Number.isFinite(n)&&n>0?n:null; }
        function safeNum(value) { const n=Number(value); return Number.isFinite(n)?n:null; }
        function isAdultAnime(item) {
          if (item?.isAdult === true || item?.nsfw === true) return true;
          const text = `${item?.title || ''} ${item?.subtype || ''} ${item?.rating || ''}`.toLowerCase();
          return /(^|[\s-])(r18|xxx|hentai)([\s-]|$)/.test(text);
        }
        function mapAniList(media, source='anilist') {
          if (!media || media.type !== 'ANIME' || media.isAdult) return null;
          const title = pickTitle(media.title);
          if (!title) return null;
          return {
            key: media.id ? `al:${media.id}` : `t:${normalizeTitle(title)}`,
            title, image: media.coverImage?.extraLarge || media.coverImage?.large || media.coverImage?.medium || '',
            year: safeYear(media.seasonYear || media.startDate?.year), rating: safeNum(media.averageScore),
            episodes: safeNum(media.episodes), format: String(media.format || ''), status: String(media.status || ''),
            anilistId: safeNum(media.id), malId: safeNum(media.idMal), source
          };
        }
        function mapKitsu(item) {
          const a=item?.attributes||{};
          const title=pickTitle({english:a.titles?.en,romaji:a.titles?.en_jp,canonical:a.canonicalTitle,native:a.titles?.ja_jp});
          if (!title || isAdultAnime({title,nsfw:a.nsfw,rating:a.ageRating})) return null;
          let anilistId=null,malId=null;
          for(const m of item?.__mappingAttrs||[]) {
            const id=Number(m?.externalId),site=String(m?.externalSite||'').toLowerCase();
            if(!Number.isFinite(id)) continue;
            if(site.startsWith('anilist')) anilistId=id;
            if(site.startsWith('myanimelist')) malId=id;
          }
          return {
            key:anilistId?`al:${anilistId}`:malId?`mal:${malId}`:`t:${normalizeTitle(title)}`, title,
            image:a.posterImage?.large||a.posterImage?.original||a.posterImage?.medium||'',
            year:safeYear(a.startDate?.slice?.(0,4)||a.startDate),rating:safeNum(a.averageRating),
            episodes:safeNum(a.episodeCount),format:String(a.subtype||''),status:String(a.status||''),anilistId,malId,
            kitsuId:Number(item.id)||null,source:'kitsu'
          };
        }
        function mapAnikoto(row) {
          const a=row?.attributes||row||{};
          const title=pickTitle({default:a.title||a.name,english:a.title_english||a.english_title,romaji:a.title_romaji||a.romaji_title,native:a.title_native||a.native_title});
          if(!title||isAdultAnime({title,nsfw:a.nsfw,rating:a.rating})) return null;
          const anilistId=safeNum(a.anilist_id??a.anilistId),malId=safeNum(a.mal_id??a.malId);
          return {
            key:anilistId?`al:${anilistId}`:malId?`mal:${malId}`:`t:${normalizeTitle(title)}`,title,
            image:a.poster||a.poster_url||a.image||a.image_url||'',year:safeYear(a.year||a.season_year),rating:safeNum(a.rating),
            episodes:safeNum(a.episodes||a.episode_count),format:String(a.type||a.format||''),status:String(a.status||''),anilistId,malId,
            anikotoId:Number(a.id)||null,source:'anikoto'
          };
        }
        function mergeEntries(entries) {
          const map=new Map();
          for(const item of entries.filter(Boolean)) {
            const titleKey=`t:${normalizeTitle(item.title)}`;
            const keys=[item.key,item.anilistId?`al:${item.anilistId}`:'',item.malId?`mal:${item.malId}`:'',titleKey].filter(Boolean);
            let existing=null;
            for(const key of keys) if(map.has(key)){existing=map.get(key);break;}
            if(!existing){existing={...item,_sources:new Set([item.source])};for(const k of keys)map.set(k,existing);}
            else{
              existing._sources.add(item.source);for(const k of keys)map.set(k,existing);
              if(item.source==='anilist'&&item.title.length>existing.title.length)existing.title=item.title;
              existing.image ||= item.image; existing.year ||= item.year; existing.rating ??= item.rating; existing.episodes ??= item.episodes;
              existing.format ||= item.format; existing.status ||= item.status; existing.anilistId ||= item.anilistId; existing.malId ||= item.malId;
              existing.kitsuId ||= item.kitsuId; existing.anikotoId ||= item.anikotoId;
              if(item.source==='anikoto'&&item.image)existing.image=item.image;
            }
          }
          const unique=[];const seen=new Set();
          for(const item of map.values()){if(seen.has(item))continue;seen.add(item);item._sources=[...item._sources];unique.push(item);}
          return unique.filter(x=>x.title).sort((a,b)=>{const ar=a.rating??-1,br=b.rating??-1;return br!==ar?br-ar:a.title.localeCompare(b.title);});
        }
        async function fetchJson(url,options={}) {
          const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),options.timeout||9000);
          try{
            const res=await fetch(url,{method:options.method||'GET',headers:options.headers||{},body:options.body,signal:ctl.signal,cache:'no-store'});
            if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);return await res.json();
          }finally{clearTimeout(timer);}
        }
        async function fetchAniList(kind) {
          const sort=kind==='trending'?'TRENDING_DESC':'POPULARITY_DESC';
          const query=`query($page:Int,$perPage:Int,$sort:[MediaSort]){Page(page:$page,perPage:$perPage){media(sort:$sort,type:ANIME,isAdult:false){id idMal type isAdult title{romaji english native} coverImage{extraLarge large medium} averageScore seasonYear startDate{year} format status episodes}}}`;
          const result=await fetchJson('https://graphql.anilist.co',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables:{page:1,perPage:PER_SOURCE,sort:[sort]}}),timeout:10000});
          if(result?.errors?.length&&!result?.data)throw new Error(result.errors[0]?.message||'anilist query failed');
          return (result?.data?.Page?.media||[]).map(mapAniList).filter(Boolean);
        }
        async function fetchKitsu(){
          const url=`https://kitsu.io/api/edge/anime?filter[status]=current&sort=-userCount&page[limit]=${PER_SOURCE}&include=mappings`;
          const result=await fetchJson(url,{timeout:10000});
          const included=new Map((result?.included||[]).filter(x=>x?.type==='mappings'&&x?.id).map(x=>[String(x.id),x.attributes||{}]));
          const rows=(result?.data||[]).map(item=>{item.__mappingAttrs=(item?.relationships?.mappings?.data||[]).map(ref=>included.get(String(ref?.id))).filter(Boolean);return item;});
          return rows.map(mapKitsu).filter(Boolean);
        }
        async function fetchAnikoto(){
          const result=await fetchJson(`https://anikotoapi.site/recent-anime?page=1&per_page=${PER_SOURCE}`,{timeout:10000});
          const rows=result?.data||result?.anime||result?.results||[];
          return Array.isArray(rows)?rows.map(mapAnikoto).filter(Boolean):[];
        }
        function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return c?.items?.length?c:null;}catch{return null;}}
        function writeCache(items,sources){try{localStorage.setItem(CACHE_KEY,JSON.stringify({timestamp:Date.now(),items,sources}));}catch{}}
        function makeSkeletons(count=12){grid.innerHTML='';for(let i=0;i<count;i++){const c=document.createElement('div');c.className='card anime-card anime-skel';c.setAttribute('aria-hidden','true');grid.appendChild(c);}}
        function displayImage(img,item){
          const candidates=[];if(item.image)candidates.push(item.image);let i=0;
          const next=()=>{if(i>=candidates.length){img.remove();return;}img.src=candidates[i++];};img.onerror=next;next();
        }
        function safeExternal(url){try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:'';}catch{return '';}}
        function escapeHtml(value){return String(value).replace(/[&<>\"']/g,ch=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));}

        function openTab(url){if(!url)return;window.openTab?.(url);if(!window.openTab)window.open(url,'_blank','noopener,noreferrer');}
        async function getWatchData(a){
          if(!a?.anilistId)return {episodes:[],providers:[]};
          const query=`query($id:Int!){Media(id:$id,type:ANIME){id title{romaji english native} streamingEpisodes{title thumbnail url site} externalLinks{url site type isDisabled}}}`;
          const result=await fetchJson('https://graphql.anilist.co',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables:{id:Number(a.anilistId)}}),timeout:9000});
          const media=result?.data?.Media||{};
          const seen=new Set();
          const episodes=(media.streamingEpisodes||[]).map(x=>({title:x?.title||'episode',site:x?.site||'streaming site',url:safeExternal(x?.url),thumbnail:safeExternal(x?.thumbnail)})).filter(x=>x.url&&!seen.has(x.url)&&seen.add(x.url));
          const providers=(media.externalLinks||[]).filter(x=>!x?.isDisabled&&String(x?.type||'').toUpperCase()==='STREAMING').map(x=>({title:`watch on ${x.site||'streaming service'}`,site:x.site||'streaming service',url:safeExternal(x.url)})).filter(x=>x.url&&!seen.has(x.url)&&seen.add(x.url));
          return {episodes,providers,siteUrl:`https://anilist.co/anime/${encodeURIComponent(a.anilistId)}`};
        }
        function closeModal(){modal.classList.add('hidden');modalBody.innerHTML='';modalActions.innerHTML='';}
        async function showWatch(a){
          modal.classList.remove('hidden');modalTitle.textContent=a.title;modalSub.textContent='checking official streaming links...';modalBody.innerHTML='<div class="anime-modal-note">loading...</div>';modalActions.innerHTML='';
          try{
            const data=await getWatchData(a);
            modalBody.innerHTML='';
            const links=[...data.episodes,...data.providers];
            if(!links.length){modalBody.innerHTML='<div class="anime-modal-note">no official episode links were returned for this title. you can still check its current legal availability below.</div>';}
            else{
              for(const l of links){
                const el=document.createElement('button');el.className='anime-link';el.type='button';
                el.innerHTML=`<span class="anime-link-main"><span class="anime-link-title">${escapeHtml(l.title)}</span><span class="anime-link-site">${escapeHtml(l.site)}</span></span><span class="anime-link-arrow">↗</span>`;
                el.onclick=()=>openTab(l.url);modalBody.appendChild(el);
              }
            }
            modalSub.textContent=links.length?`${links.length} official streaming link${links.length===1?'':'s'} found`:'no official episode link found';
            const just=`https://www.justwatch.com/uk/search?q=${encodeURIComponent(a.title)}`;
            const jw=document.createElement('a');jw.className='anime-modal-action';jw.href=just;jw.target='_blank';jw.rel='noreferrer';jw.textContent='find where to watch';modalActions.appendChild(jw);
            if(data.siteUrl){const al=document.createElement('button');al.className='anime-modal-action';al.type='button';al.textContent='open anilist';al.onclick=()=>openTab(data.siteUrl);modalActions.appendChild(al);}
          }catch(err){
            modalSub.textContent='could not fetch streaming links';modalBody.innerHTML=`<div class="anime-modal-note">${escapeHtml(err?.message||'request failed')}<br><br>try refresh, or use the availability search below.</div>`;
            const jw=document.createElement('a');jw.className='anime-modal-action';jw.href=`https://www.justwatch.com/uk/search?q=${encodeURIComponent(a.title)}`;jw.target='_blank';jw.rel='noreferrer';jw.textContent='find where to watch';modalActions.appendChild(jw);
          }
        }
        function render(){
          const term=q.value.trim().toLowerCase();
          const list=term?all.filter(a=>`${a.title} ${a.year||''}`.toLowerCase().includes(term)):all;
          grid.innerHTML='';
          for(const a of list){
            const c=document.createElement('div');c.className='card anime-card';c.setAttribute('role','article');c.tabIndex=0;
            const cover=document.createElement('div');cover.className='anime-cover';
            if(a.image){const im=document.createElement('img');im.alt='';im.loading='lazy';displayImage(im,a);cover.appendChild(im);}else{const ph=document.createElement('div');ph.className='anime-placeholder';ph.textContent=a.title[0]||'?';cover.appendChild(ph);}
            const info=document.createElement('div');info.className='anime-info';
            const badges=[];if(a.format)badges.push(a.format.replace(/_/g,' '));if(a.year)badges.push(String(a.year));if(a.episodes)badges.push(`${a.episodes} eps`);if(a.rating!=null)badges.push(`${Math.round(a.rating)}%`);
            for(const value of badges.slice(0,3)){const b=document.createElement('span');b.className='anime-badge'+(value===String(a.year)?' muted':'');b.textContent=value;info.appendChild(b);}
            const nm=document.createElement('div');nm.className='nm';nm.textContent=a.title;cover.appendChild(info);cover.appendChild(nm);
            const watch=document.createElement('button');watch.type='button';watch.className='anime-watch has-links';watch.textContent='watch';watch.onclick=e=>{e.stopPropagation();showWatch(a);};
            cover.appendChild(watch);c.appendChild(cover);
            c.onclick=()=>showWatch(a);c.onkeydown=e=>{if(e.key==='Enter')showWatch(a);};grid.appendChild(c);
          }
          if(!list.length)grid.innerHTML='<div class="empty">nothing found</div>';
          status.textContent=`${list.length} titles`;
        }
        async function load(force=false){
          const token=++refreshToken;refresh.disabled=true;makeSkeletons();
          const cache=readCache();const cacheFresh=cache&&(Date.now()-cache.timestamp<CACHE_TTL);
          if(!force&&cacheFresh){all=cache.items||[];render();status.textContent=`${all.length} titles · cached`;}
          const results=await Promise.allSettled([fetchAniList('trending'),fetchAniList('popular'),fetchKitsu(),fetchAnikoto()]);
          if(token!==refreshToken)return;
          const entries=[],working=[];const labels=['anilist trending','anilist popularity','kitsu','anikoto'];
          results.forEach((r,i)=>{if(r.status==='fulfilled'){working.push(labels[i]);entries.push(...r.value);}});
          const merged=mergeEntries(entries);
          if(merged.length){all=merged;writeCache(all,working);render();status.textContent=`${all.length} titles · ${working.join(' + ')}`;}
          else if(all.length){render();status.textContent=`${all.length} titles · cached`;}else{grid.innerHTML='<div class="empty">could not load anime right now</div>';status.textContent='all anime sources failed';}
          refresh.disabled=false;
        }
        q.addEventListener('input',render);refresh.addEventListener('click',()=>load(true));
        modalClose.addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
        const cached=readCache();if(cached?.items?.length){all=cached.items;render();status.textContent=`${all.length} titles · cached`;}
        load(false);
      };
      return pageShell(cfg,'anime',body,script,css);
    }

    function pageChat(cfg) {
      const css = `iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg-body)}`;
      const body = `<iframe id="chat" title="chat" allow="autoplay; fullscreen; clipboard-write; microphone; camera"></iframe>`;
      const script = function (cfg) { document.getElementById('chat').src = cfg.chatUrl; };
      return pageShell(cfg, 'chat', body, script, css);
    }

    async function buildInternalPages() {
      window.__fontHead = await getFontHead();
      const abs = p => new URL(p, location.href).href;
      const cfg = {
        brand: BRAND_PILL,
        splashes: SPLASHES,
        splashImages: SPLASH_IMAGES.map(f => abs(SPLASH_DIR + f)),
        chatUrl: abs(CHAT_PAGE),
        anime: ANIME,
        bookmarks: DEFAULT_BOOKMARKS
      };
      const html = { home: pageHome(cfg), games: pageGames(cfg), anime: pageAnime(cfg), chat: pageChat(cfg) };
      window.__pageURLs = {};
      for (const [name, src] of Object.entries(html)) window.__pageURLs[name] = URL.createObjectURL(new Blob([src], { type: 'text/html' }));
    }

    function openInternalTab(name) {
      if (!['games','anime','chat'].includes(name) || !window.__pageURLs?.[name]) return;
      const ex = tabs.find(t => t.page === name); if (ex) { switchTab(ex.id); return ex; } return createTab(true, name, { forceChrome: true });
    }

    function reloadTab(tab) {
      if (!tab) return;
      clearTimeout(tab.skipTimeout);
      clearTimeout(tab.loadFallbackTimeout);
      tab.loading = true;
      if (tab.page && window.__pageURLs?.[tab.page]) {
        tab.frame.frame.src = window.__pageURLs[tab.page];
      } else if (tab.url) {
        tab.frame.go(tab.url);
      } else {
        tab.frame.frame.src = 'about:blank';
      }
      if (tab.id === activeTabId) {
        setBrowserMode(tab.forceChrome || (!tab.page && Boolean(tab.url)));
        showIframeLoading(false);
      }
      updateTabsUI();
      updateAddressBar();
    }

    function openPage(name, tab = getActiveTab(), push = true) {
      if (!tab || !window.__pageURLs?.[name]) return;
      tab.page = name; tab.url = ''; tab.title = PAGE_TITLES[name]; tab.favicon = null; tab.loading = false;
      if (name !== 'home') tab.forceChrome = true;
      if (push && !tab._navigating) {
        tab.historyStack = tab.historyStack.slice(0, tab.historyIndex + 1);
        tab.historyStack.push('page:' + name);
        tab.historyIndex = tab.historyStack.length - 1;
      }
      tab.frame.frame.src = window.__pageURLs[name];
      if (tab.id === activeTabId) showIframeLoading(false);

    async function pingWispServer(url, timeout = 4000) {
      return new Promise(resolve => {
        const start = Date.now();
        try {
          const ws = new WebSocket(url);
          const timer = setTimeout(() => {
            try { ws.close(); } catch {}
            resolve({url, success:false, latency:null});
          }, timeout);
          ws.onopen = () => {
            clearTimeout(timer);
            const latency = Date.now() - start;
            try { ws.close(); } catch {}
            resolve({url, success:true, latency});
          };
          ws.onerror = () => {
            clearTimeout(timer);
            try { ws.close(); } catch {}
            resolve({url, success:false, latency:null});
          };
        } catch {
          resolve({url, success:false, latency:null});
        }
      });
    }

    async function findBestWispServer(servers, currentUrl) {
      if (!servers?.length) return currentUrl;
      const results = await Promise.all(servers.map(s => pingWispServer(s.url)));
      const working = results.filter(r => r.success).sort((a,b) => a.latency - b.latency);
      return working[0]?.url || currentUrl || servers[0]?.url;
    }

    async function initializeWithBestServer() {
      const autoswitch = localStorage.getItem('wispAutoswitch') !== 'false';
      const allServers = getAllWispServers();
      if (!autoswitch || allServers.length <= 1) return;
      const currentUrl = localStorage.getItem('proxServer') || DEFAULT_WISP;
      const currentCheck = await pingWispServer(currentUrl);
      if (currentCheck.success) return;
      const best = await findBestWispServer(allServers, currentUrl);
      if (best && best !== currentUrl) localStorage.setItem('proxServer', best);
    }

        if (document.activeElement !== input) { caret.style.display='none'; return; }
        const ctx = canvas.getContext('2d');
        const cs = getComputedStyle(input);
        ctx.font = cs.font;
        const width = ctx.measureText(input.value.slice(0, input.selectionStart ?? input.value.length)).width;
        caret.style.left = `${40 + width}px`;
        caret.style.top = '50%';
        caret.style.transform = 'translateY(-50%)';
        caret.style.display = 'block';
      };
      ['focus','input','keyup','click','select'].forEach(ev => input.addEventListener(ev, update));

    function createTab(makeActive=true, page=NEW_TAB_PAGE, options={}) {
      if (tabs.length >= 12) return;

      const frame = sharedScramjet.createFrame();

      const tab = {
        id:nextTabId++, title:PAGE_TITLES[page], url:'', page, forceChrome, frame, loading:false, favicon:null,
        skipTimeout:null, loadFallbackTimeout:null, loadStartTime:null,
        historyStack:['page:'+page], historyIndex:0, _navigating:false, _erudaOpen:false
      };
      frame.frame.src = window.__pageURLs[page];
      frame.addEventListener('urlchange', e => {
        tab.page = null;

        if (!tab._navigating) {
          tab.historyStack = tab.historyStack.slice(0, tab.historyIndex + 1);
          if (tab.historyStack[tab.historyIndex] !== e.url) tab.historyStack.push(e.url);
          tab.historyIndex = tab.historyStack.length - 1;
        }
        tab.loading = true; tab.loadStartTime = Date.now();
        if (tab.id === activeTabId) showIframeLoading(true, tab.url);
        try {
          const u = new URL(e.url);
          tab.title = u.hostname || 'browsing';
          tab.favicon = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=32`;

        if (tab.id === activeTabId) {
          showIframeLoading(false);

          const cw = frame.frame.contentWindow;

    }

    function renderSettingsControls() {
      document.querySelectorAll('[data-setting-select]').forEach(btn=>{
        const key=btn.dataset.settingSelect, value=btn.dataset.value;
        btn.classList.toggle('active', getSetting(key)===value);
        btn.onclick=()=>{ setSetting(key,value); applyStoredSettings(); renderSettingsControls(); };
      });
      document.querySelectorAll('[data-setting-toggle]').forEach(btn=>{
        const key=btn.dataset.settingToggle, on=!!getSetting(key);
        btn.classList.toggle('active',on);
        btn.onclick=()=>{ setSetting(key,!getSetting(key)); applyStoredSettings(); renderSettingsControls(); };
      });
      const engine=document.getElementById('search-engine-setting');
      if(engine){ engine.value=getSetting('engine'); engine.onchange=()=>setSetting('engine',engine.value); }
    }

    function resetAppearanceSettings() {
      ['motion','grid','glow','hover','compact','engine'].forEach(key=>{ try{localStorage.removeItem('mochiiSetting:'+key);}catch{} });
      try{localStorage.removeItem('mochiiTheme');}catch{}
      document.documentElement.removeAttribute('data-theme');
      applyStoredSettings(); renderThemeList(); renderSettingsControls(); sendThemeToNtTabs();
    }

    function openSettings() {
      const modal=document.getElementById('wisp-settings-modal');
      if(!modal) return;
      modal.classList.remove('hidden');
      document.getElementById('close-wisp-modal').onclick=()=>modal.classList.add('hidden');
      document.getElementById('save-custom-wisp').onclick=saveCustomWisp;
      document.getElementById('reset-settings').onclick=resetAppearanceSettings;
      modal.onclick=e=>{if(e.target===modal) modal.classList.add('hidden');};
      renderThemeList();
      renderSettingsControls();
      renderServerList();
    }

    function renderServerList() {
      const list=document.getElementById('server-list'); list.innerHTML='';
      const currentUrl=localStorage.getItem('proxServer') || DEFAULT_WISP;
      const all=[...WISP_SERVERS,...getStoredWisps()];
      all.forEach((server,index)=>{
        const isActive=server.url===currentUrl;
        const item=document.createElement('div'); item.className=`wisp-option ${isActive?'active':''}`;
        item.innerHTML=`<div class="wisp-option-header"><div class="wisp-option-name">${escapeHtml(server.name)} ${isActive?'•':''}</div><div class="server-status"><span class="ping-text">...</span><span class="status-indicator"></span>${index>=WISP_SERVERS.length?`<button class="delete-wisp-btn" aria-label="remove">×</button>`:''}</div></div><div class="wisp-option-url">${escapeHtml(server.url)}</div>`;
        item.onclick=()=>setWisp(server.url);
        if(index>=WISP_SERVERS.length) item.querySelector('.delete-wisp-btn').onclick=e=>{e.stopPropagation(); deleteCustomWisp(server.url);};
        list.appendChild(item); checkServerHealth(server.url,item);
      });

      const isAutoswitch=localStorage.getItem('wispAutoswitch')!=='false';
      const toggle=document.createElement('div'); toggle.className='wisp-option'; toggle.style.cursor='default';
      toggle.innerHTML=`<div class="wisp-option-header"><div class="wisp-option-name">auto-switch on failure</div><div class="toggle-switch ${isAutoswitch?'active':''}" id="autoswitch-toggle"><div class="toggle-knob"></div></div></div>`;
      toggle.onclick=()=>{ const state=!isAutoswitch; localStorage.setItem('wispAutoswitch',state); location.reload(); };
      list.appendChild(toggle);
    }

    function saveCustomWisp() {
      const input=document.getElementById('custom-wisp-input'); let url=input.value.trim();
      if(!/^wss?:\/\//i.test(url) || (location.protocol==='https:' && /^ws:/i.test(url))) return; if(!url.endsWith('/')) url += '/';
      const custom=getStoredWisps();
      if(custom.some(w=>w.url===url) || WISP_SERVERS.some(w=>w.url===url)) return;
      custom.push({name:`custom ${custom.length+1}`,url}); localStorage.setItem('customWisps',JSON.stringify(custom)); setWisp(url); input.value='';
    }

    window.deleteCustomWisp=function(url) {
      const custom=getStoredWisps().filter(w=>w.url!==url); localStorage.setItem('customWisps',JSON.stringify(custom));
      if(localStorage.getItem('proxServer')===url) setWisp(DEFAULT_WISP); else renderServerList();
    };

    async function checkServerHealth(url, element) {
      const dot=element.querySelector('.status-indicator'); const text=element.querySelector('.ping-text'); const start=Date.now();
      const offline=()=>{dot.classList.add('status-error'); text.textContent='offline';};
      try {
        const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),2000);
        await fetch(url.replace(/^wss?:\/\//,'https://').replace('/wisp/','/health'),{method:'HEAD',signal:controller.signal,mode:'no-cors'});
        clearTimeout(timeout); dot.classList.add('status-success'); text.textContent=`${Date.now()-start}ms`;
      } catch {
        try {
          const ws=new WebSocket(url);
          ws.onopen=()=>{dot.classList.add('status-success');text.textContent=`${Date.now()-start}ms`;ws.close();};
          ws.onerror=offline;
          setTimeout(()=>{if(ws.readyState!==WebSocket.OPEN){try{ws.close();}catch{} offline();}},1200);
        } catch { offline(); }
      }
    }

    function setWisp(url) {
      if (url === localStorage.getItem('proxServer')) return;
      localStorage.setItem('proxServer',url);
      try { navigator.serviceWorker.controller?.postMessage({type:'config',wispurl:url}); } catch {}
      setTimeout(()=>location.reload(),300);
    }

    function hideErudaEntryBtn(win) {
      const attempt=tries=>{ try { const c=win.document.getElementById('eruda'); if(!c){if(tries) setTimeout(()=>attempt(tries-1),80);return;} const root=c.shadowRoot||c; const btn=root.querySelector('.eruda-entry-btn'); if(btn) btn.style.cssText+='display:none!important;visibility:hidden!important;pointer-events:none!important;'; else if(tries) setTimeout(()=>attempt(tries-1),80); } catch {} };
      attempt(10);
    }

    function toggleDevTools() {
      const tab=getActiveTab(); const win=tab?.frame.frame.contentWindow; if(!win) return;
      try {
        if(win.eruda) {
          if(tab._erudaOpen){win.eruda.hide();tab._erudaOpen=false;} else {win.eruda.show();hideErudaEntryBtn(win);tab._erudaOpen=true;}
          return;
        }
        const script=win.document.createElement('script'); script.src='https://cdn.jsdelivr.net/npm/eruda';
        script.onload=()=>{win.eruda.init();win.eruda.show();hideErudaEntryBtn(win);tab._erudaOpen=true;};
        win.document.body.appendChild(script);
      } catch(e) { console.warn('devtools unavailable',e); }
    }

    function checkHashParameters() {
      if (!location.hash) return;
      const hash=decodeURIComponent(location.hash.slice(1));
      if(hash) handleSubmit(hash);
      history.replaceState(null,'',location.pathname + location.search);
    }

    async function proxyInit() {
      const root=document.getElementById('proxy-app');
      root.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-body)"><div style="display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text-muted);font-size:12px"><div class="spinner" style="margin:0"></div><div>starting mochii...</div></div></div>`;

      await buildInternalPages();

      try {
        await fetchWispServers();
        await initializeWithBestServer();
        await getSharedScramjet();
        try { await getSharedConnection(); } catch (e) { const alt = getAllWispServers().find(s => s.url !== localStorage.getItem('proxServer')); if (!alt) throw e; localStorage.setItem('proxServer', alt.url); sharedConnectionReady = false; await getSharedConnection(); }

        if ('serviceWorker' in navigator) {
          const reg=await navigator.serviceWorker.register(getBasePath()+'sw.js',{scope:getBasePath()});
          await navigator.serviceWorker.ready;
          const wispUrl=localStorage.getItem('proxServer') || DEFAULT_WISP;
          const config={type:'config',wispurl:wispUrl,servers:getAllWispServers(),autoswitch:localStorage.getItem('wispAutoswitch')!=='false'};
          navigator.serviceWorker.addEventListener('message', async ({ data }) => { if (data?.type !== 'wispChanged' || !data.url) return; localStorage.setItem('proxServer', data.url); try { await sharedConnection.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/libcurl-transport@1.5.2/dist/index.mjs', [{ wisp: data.url }]); } catch {} });
          const send=()=>{const sw=reg.active||navigator.serviceWorker.controller;if(sw)sw.postMessage(config);};
          send(); setTimeout(send,500); setTimeout(send,1500); reg.update();
        }

        await initializeBrowser();
        proxyBrowserInitialized=true;
      } catch(err) {
        console.error('proxy initialization error:',err);
        root.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-body)"><div class="message-content"><h1>init error</h1><p>${escapeHtml(err?.message || 'unknown error')}</p><button class="message-button" onclick="location.reload()">retry</button></div></div>`;
      }
    }

    window.addEventListener('message', event => {
      if(event.data?.type==='GHOSTLINK_QUERY_THEME') sendThemeToIframe();
      if(event.data?.type==='GHOSTLINK_NT_READY') sendThemeToNtTabs();
    });

    function sendThemeToIframe() {}
    function sendThemeToNtTabs() {
      const vars = readThemeVars();
      tabs.forEach(tab => { if (tab.page && tab.frame?.frame?.contentWindow) try { tab.frame.frame.contentWindow.postMessage({type:'GHOSTLINK_NT_THEME', vars}, '*'); } catch {} });
    }

    applyStoredSettings();
    proxyInit();
  </script>
</body>
</html>
