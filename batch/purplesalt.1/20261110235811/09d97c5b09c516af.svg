<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;inset:0;background:#000;">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;background:#000;">
      <head>
        <meta charset="UTF-8"/>
        <title>Fullscreen</title>
        <style>
          /* <![CDATA[ */
          html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
          }
          iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
          }
          /* ]]> */
        </style>
      </head>
      <body>
        <iframe src="https://testingcf.jsdelivr.net/gh/mathissofun137/lumaosbetatesting/lightspeed1.svg" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:#000;"></iframe>
      </body>
    </html>
  </foreignObject>
</svg>