<!DOCTYPE html>
<!-- saved from url=(0072)https://stash-files.b-cdn.net/APPS/App%20Store/APPS/ChatGPT/chatgpt.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT</title>
  <style>
    :root {
      --bg-main: #000000;
      --bg-sidebar: #0d0d0d;
      --bg-card: #171717;
      --bg-input: #212121;
      --bg-hover: #2f2f2f;
      --bg-user-msg: #2563eb;
      --bg-code: #09090b;
      --border-color: #262626;
      --text-main: #ffffff;
      --text-muted: #8e8ea0;
      --btn-cancel: #2f2f2f;
      --btn-cancel-text: #ffffff;
      --btn-danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-pill: 9999px;
      --transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-mode {
      --bg-main: #ffffff;
      --bg-sidebar: #f9f9fb;
      --bg-card: #ffffff;
      --bg-input: #f4f4f7;
      --bg-hover: #e5e5ea;
      --bg-user-msg: #2563eb;
      --bg-code: #f1f1f5;
      --border-color: #e5e5e8;
      --text-main: #0d0d0d;
      --text-muted: #8e8ea0;
      --btn-cancel: #e5e5ea;
      --btn-cancel-text: #0d0d0d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-main);
      background-color: var(--bg-main);
      height: 100vh;
      overflow: hidden;
      transition: background-color 200ms ease, color 200ms ease;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: invert(1);
      transition: filter 200ms ease, opacity 200ms ease;
    }

    body.light-mode .logo-img { filter: invert(0); }

    .sidebar {
      width: 260px;
      height: 100%;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      transition: var(--transition);
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .sidebar.collapsed {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right: none;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
      height: 40px;
    }

    .sidebar-header-left { display: flex; align-items: center; gap: 8px; }
    .sidebar-header-right { display: flex; align-items: center; gap: 2px; }

    .btn-icon {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-pill);
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 12px;
    }

    .btn-new-chat:hover { background-color: var(--bg-hover); }

    .recents-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .recents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius-pill);
      transition: var(--transition);
    }

    .recents-header:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .arrow-icon {
      opacity: 0;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .recents-header:hover .arrow-icon { opacity: 1; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
      transition: var(--transition);
      overflow: hidden;
    }

    .history-list.collapsed {
      max-height: 0;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius-pill);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .history-item.active, .history-item:hover { background-color: var(--bg-hover); }

    .history-title {
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      flex: 1;
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .history-item:hover .history-actions { opacity: 1; }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .action-icon-btn:hover { color: var(--text-main); }
    .action-icon-btn.delete-btn:hover { color: var(--btn-danger); }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 0 4px;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
      position: relative;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: var(--transition);
      flex: 1;
      overflow: hidden;
    }

    .user-profile:hover { background-color: var(--bg-hover); }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--bg-hover);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .settings-wrapper { position: relative; }

    .settings-popup {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      width: 220px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
      animation: popupSlideUp 150ms ease;
    }

    .settings-popup.open { display: flex; }

    @keyframes popupSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .settings-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-title { font-size: 14px; font-weight: 600; color: var(--text-main); }

    .theme-toggle-group { display: flex; align-items: center; gap: 4px; }

    .theme-icon-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .theme-icon-btn:hover, .theme-icon-btn.active { color: var(--text-main); }

    .btn-upgrade {
      width: 100%;
      padding: 9px 14px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-upgrade:hover { background-color: var(--border-color); }

    .settings-popup-footer {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      width: 100%;
      margin-top: 2px;
    }

    .game-stash-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .game-stash-link:hover { text-decoration: underline; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background-color: var(--bg-main);
    }

    .top-bar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
    }

    .top-bar-left { display: flex; align-items: center; gap: 8px; }

    .btn-minimized-toggle {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: var(--transition);
    }

    .btn-minimized-toggle:hover { background-color: var(--bg-hover); }

    .toggle-logo-icon, .toggle-sidebar-icon {
      position: absolute;
      transition: opacity 150ms ease;
    }

    .toggle-sidebar-icon { opacity: 0; color: var(--text-main); }

    .btn-minimized-toggle:hover .toggle-logo-icon { opacity: 0; }
    .btn-minimized-toggle:hover .toggle-sidebar-icon { opacity: 1; }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 18px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      transition: var(--transition);
    }

    .model-selector:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .model-menu {
      position: absolute;
      top: 50px;
      left: 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 200px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .model-menu.open { display: flex; }

    .model-option {
      padding: 8px 12px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
    }

    .model-option:hover { background-color: var(--bg-hover); }

    .model-option.faded {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .model-option.faded:hover { background: transparent; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .messages-list {
      width: 100%;
      max-width: 768px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 18vh;
      text-align: center;
    }

    .welcome-logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 30px;
      font-weight: 600;
      color: var(--text-main);
    }

    .message-row {
      display: flex;
      width: 100%;
      animation: fadeIn 200ms ease;
    }

    .message-row.user-row { justify-content: flex-end; }
    .message-row.gpt-row { justify-content: flex-start; gap: 16px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-bubble-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      max-width: 75%;
    }

    .user-bubble {
      background-color: var(--bg-user-msg);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 22px;
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
    }

    .user-edit-box {
      width: 100%;
      min-width: 300px;
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-edit-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 16px;
      resize: none;
      min-height: 24px;
      padding: 0;
      margin: 0;
      line-height: 1.5;
    }

    .user-edit-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    .btn-cancel {
      background-color: var(--btn-cancel);
      color: var(--btn-cancel-text);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-cancel:hover { opacity: 0.9; }

    .btn-save-send {
      background-color: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-save-send:hover { opacity: 0.9; }

    .message-hover-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .message-row:hover .message-hover-actions { opacity: 1; }

    .gpt-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .gpt-content-body {
      flex: 1;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
      word-break: break-word;
    }

    .typewriter-chunk {
      animation: smoothFadeIn 120ms ease-out forwards;
      display: inline;
    }

    @keyframes smoothFadeIn {
      from {
        opacity: 0;
        filter: blur(1px);
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .gpt-content-body a.custom-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
    }

    .gpt-content-body a.custom-link:hover { text-decoration: underline; }

    .code-block-wrapper {
      background-color: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      margin: 14px 0;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: var(--bg-hover);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .code-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-copy-code {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-copy-code:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .code-content {
      padding: 16px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre;
    }

    .code-token-keyword { color: #ff79c6; font-weight: 600; }
    .code-token-string { color: #f1fa8c; }
    .code-token-number { color: #bd93f9; }
    .code-token-comment { color: #6272a4; font-style: italic; }
    .code-token-function { color: #50fa7b; font-weight: 500; }
    .code-token-operator { color: #ff79c6; }
    .code-token-tag { color: #8be9fd; font-weight: 600; }
    .code-token-attr { color: #50fa7b; }
    .code-token-variable { color: #f8f8f2; }

    .loading-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: dotBounce 1.2s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    .input-wrapper {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding: 0 16px 24px;
      transition: opacity 150ms ease;
    }

    .input-wrapper.disabled-state {
      opacity: 0.5;
      pointer-events: none;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 14px;
      gap: 8px;
      transition: var(--transition);
    }

    .input-box:focus-within { border-color: var(--text-muted); }

    .file-attachment-chip {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: fit-content;
      font-size: 13px;
      color: var(--text-main);
    }

    .file-attachment-chip.active { display: flex; }

    .input-row { display: flex; align-items: center; gap: 8px; width: 100%; }

    .btn-round {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .btn-round:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-round.recording {
      color: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    textarea#userInput {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 16px;
      line-height: 24px;
      max-height: 200px;
      height: 24px;
      padding: 0;
      margin: 0;
      background: transparent;
      color: var(--text-main);
      display: block;
    }

    textarea#userInput::placeholder { color: var(--text-muted); }

    .btn-send {
      background-color: var(--text-main);
      color: var(--bg-main);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .btn-send:disabled {
      background-color: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.5;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 150ms ease;
    }

    .modal-overlay.active .modal-card { transform: scale(1); }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-body {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
